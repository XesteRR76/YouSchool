<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <filter id="m3_container_shadow_dark" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
        <filter id="shadow_stem_dark" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#050014" flood-opacity="0.4"/>
        </filter>
        <filter id="shadow_fold_dark" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#050014" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="bg_dark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#211C2B"/>
            <stop offset="100%" stop-color="#120F19"/>
        </linearGradient>
        <linearGradient id="g_stem_dark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5E35B1"/>
            <stop offset="100%" stop-color="#3C1A7E"/>
        </linearGradient>
        <linearGradient id="g_left_dark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9A70FF"/>
            <stop offset="100%" stop-color="#7C4DFF"/>
        </linearGradient>
        <linearGradient id="g_right_dark" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#E8DEF8"/>
            <stop offset="100%" stop-color="#D0BCFF"/>
        </linearGradient>
    </defs>

    <rect x="28" y="28" width="456" height="456" rx="116" fill="url(#bg_dark)" filter="url(#m3_container_shadow_dark)"/>
    <rect x="28" y="28" width="456" height="456" rx="116" fill="none" stroke="#49454F" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- 1. Stem Capsule -->
    <rect x="-51.30" y="-51.30" width="102.60" height="249.75" rx="51.30" ry="51.30"
        fill="url(#g_stem_dark)"
        transform="translate(256.00, 237.56) rotate(0)" />

    <!-- 2. Right Arm Capsule -->
    <rect x="-51.30" y="-51.30" width="102.60" height="256.50" rx="51.30" ry="51.30"
        fill="url(#g_right_dark)"
        filter="url(#shadow_stem_dark)"
        transform="translate(256.00, 257.81) rotate(212.0)" />

    <!-- 3. Left Arm Capsule -->
    <rect x="-51.30" y="-51.30" width="102.60" height="256.50" rx="51.30" ry="51.30"
        fill="url(#g_left_dark)"
        filter="url(#shadow_fold_dark)"
        transform="translate(256.00, 257.81) rotate(148.0)" />
</svg>