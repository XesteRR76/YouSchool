<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Material You Elevation Shadows -->
        <filter id="m3_container_shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#381E72" flood-opacity="0.14"/>
        </filter>
        <filter id="shadow_stem" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#140033" flood-opacity="0.25"/>
        </filter>
        <filter id="shadow_fold" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="4" dy="5" stdDeviation="6" flood-color="#140033" flood-opacity="0.28"/>
        </filter>
        <!-- Tonal Gradients (Material You Lavender / Purple) -->
        <linearGradient id="bg_light" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCF8FF"/>
            <stop offset="100%" stop-color="#EDE6F4"/>
        </linearGradient>
        <linearGradient id="g_stem" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#553491"/>
            <stop offset="100%" stop-color="#35176E"/>
        </linearGradient>
        <linearGradient id="g_left" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C4DFF"/>
            <stop offset="100%" stop-color="#6750A4"/>
        </linearGradient>
        <linearGradient id="g_right" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#D0BCFF"/>
            <stop offset="100%" stop-color="#B69DF8"/>
        </linearGradient>
    </defs>

    <!-- Material You Squircle Container -->
    <rect x="28" y="28" width="456" height="456" rx="116" fill="url(#bg_light)" filter="url(#m3_container_shadow)"/>
    <rect x="28" y="28" width="456" height="456" rx="116" fill="none" stroke="#E8DEF8" stroke-width="2"/>

    <!-- 1. Stem Capsule (Underneath) -->
    <rect x="-51.30" y="-51.30" width="102.60" height="249.75" rx="51.30" ry="51.30"
        fill="url(#g_stem)"
        transform="translate(256.00, 237.56) rotate(0)" />

    <!-- 2. Right Arm Capsule (Shares common bottom end, underneath left arm) -->
    <rect x="-51.30" y="-51.30" width="102.60" height="256.50" rx="51.30" ry="51.30"
        fill="url(#g_right)"
        filter="url(#shadow_stem)"
        transform="translate(256.00, 257.81) rotate(212.0)" />

    <!-- 3. Left Arm Capsule (Overlaps right arm and stem at shared bottom end) -->
    <rect x="-51.30" y="-51.30" width="102.60" height="256.50" rx="51.30" ry="51.30"
        fill="url(#g_left)"
        filter="url(#shadow_fold)"
        transform="translate(256.00, 257.81) rotate(148.0)" />
</svg>