name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, base64

          b64 = os.environ.get("RELEASE_KEYSTORE_BASE64", "").strip()
          if b64:
              try:
                  raw = base64.b64decode(b64)
                  with open("app/release.jks", "wb") as f:
                      f.write(raw)
                  print("Keystore file written from secret.")
              except Exception as e:
                  print(f"Warning: Failed to decode base64: {e}")
          EOF

          STOREPASS="${KEYSTORE_PASSWORD:-youschool}"
          ALIAS="${KEY_ALIAS:-youschool}"
          KEYPASS="${KEY_PASSWORD:-youschool}"

          if [ -s app/release.jks ] && keytool -list -keystore app/release.jks -storepass "$STOREPASS" >/dev/null 2>&1; then
            echo "Keystore verified successfully."
          else
            echo "Generating fallback release keystore..."
            rm -f app/release.jks
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STOREPASS" \
              -keypass "$KEYPASS" \
              -dname "CN=YouSchool, OU=Development, O=YouSchool, L=Moscow, ST=Moscow, C=RU"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
